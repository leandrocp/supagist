name: Release CLI

# Publishes packages/cli to npm as `supagist` when a tag such as cli-v0.1.0 is
# pushed. The tag must match the version in packages/cli/package.json.
on:
  push:
    tags: ["cli-v*"]

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish supagist to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance signs the package with this workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches the package version
        run: |
          version="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "cli-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match packages/cli version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npx vitest run packages/cli
      - name: Check the packed files
        working-directory: packages/cli
        run: npm pack --dry-run
      - name: Publish with provenance
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
