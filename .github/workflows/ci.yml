name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # The CLI release pull request only bumps the version and changelog;
    # release.yml runs the CLI tests before it publishes.
    paths-ignore:
      - packages/cli/package.json
      - packages/cli/CHANGELOG.md

# A pull request cancels its superseded runs. Each push to main gets its own
# group (its commit), so frequent pushes no longer cancel each other's e2e
# jobs; a shared group would still drop all but the newest queued run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  verify-lockfile:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify workflow dependency lockfile
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm run fmt:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Coverage report
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Build-time placeholders — values aren't used at runtime, but
          # @supabase/ssr throws if these env vars are missing during the
          # prerender step.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: >-
            sb_publishable_ci_build_placeholder
      - name: Verify production security headers
        run: |
          npm start -- -p 3010 > /tmp/supagist-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3010/ > /dev/null && break
            sleep 1
          done
          headers="$(curl --fail --silent --show-error \
            --head http://127.0.0.1:3010/)"
          csp="$(printf '%s' "$headers" \
            | grep -i '^content-security-policy:')"
          printf '%s' "$csp" | grep -q "default-src 'self'"
          if printf '%s' "$csp" | grep -q "'unsafe-eval'"; then
            echo 'Production CSP must not allow unsafe-eval' >&2
            exit 1
          fi
          if printf '%s' "$headers" | grep -qi '^x-powered-by:'; then
            echo 'Production response exposed X-Powered-By' >&2
            exit 1
          fi

  mcp-deno:
    name: MCP Deno tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.9.0
      # Includes the real-WASM renderer tests, which fetch pinned parsers.
      - run: >-
          deno test --config supabase/functions/mcp/deno.json
          --allow-read --allow-net --allow-env
          supabase/functions/mcp/input_test.ts
          supabase/functions/mcp/manage_test.ts
          supabase/functions/mcp/rate-limit_test.ts
          supabase/functions/mcp/redact_test.ts
          supabase/functions/mcp/server_test.ts
          supabase/functions/mcp/themes_test.ts
          supabase/functions/mcp/spike/render.deno.ts
      - run: >-
          deno test --config supabase/functions/render/deno.json
          --allow-read --allow-net --allow-env
          supabase/functions/render/handler_test.ts
      - run: >-
          deno check --config supabase/functions/render/deno.json
          supabase/functions/render/index.ts

  mcp-e2e:
    name: MCP Edge Function e2e
    runs-on: ubuntu-latest
    needs: [mcp-deno]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 2.117.0
      # The stack listens on 54320-54329, inside Linux's ephemeral range, so an
      # outgoing connection (such as an image pull) can hold one of them as its
      # source port and make Docker fail to bind it. Keep them out of that range.
      - name: Start local Supabase
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          supabase start
      # publish_snippet uploads to the snippet-images bucket.
      - name: Seed local buckets
        run: supabase seed buckets
      # PNG goes MCP -> web app /api/render -> render function -> resvg, so
      # serve every function and the web app the MCP function calls back into.
      - name: Serve the Edge Functions and the web app
        run: |
          echo 'SUPAGIST_RENDER_API_URL=http://host.docker.internal:3000/api/render' > "$RUNNER_TEMP/functions.env"
          nohup supabase functions serve --env-file "$RUNNER_TEMP/functions.env" \
            > "$RUNNER_TEMP/functions.log" 2>&1 &
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
            nohup npx next dev -p 3000 -H 0.0.0.0 > "$RUNNER_TEMP/web.log" 2>&1 &
          # Unauthenticated calls get 401 once the function answers.
          for _ in $(seq 1 90); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
              http://127.0.0.1:54321/functions/v1/mcp || true)"
            if [ "$status" = 401 ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/functions.log"
          exit 1
      # Also compiles /api/render's module graph before the first PNG call.
      - name: Wait for the web app
        run: |
          for _ in $(seq 1 90); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/render \
              -H 'content-type: application/json' -d '{}' || true)"
            if [ "$status" = 400 ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/web.log"
          exit 1
      # OAuth-protected HTTP, tool schema, catalog, skill examples, 16:9 and
      # ligatures, each render as a disposable local user.
      - run: node supabase/functions/mcp/verify/appearance.mjs
      # Auth, unlisted + redacted storage, RLS visibility and -32300.
      - run: node supabase/functions/mcp/verify/publish.mjs
      # search_themes, PNG through the web app, legacy inputs, close matches.
      - run: node supabase/functions/mcp/verify/tools.mjs
      # Owner-only update_snippet and delete_snippet, including Storage removal.
      - run: node supabase/functions/mcp/verify/manage.mjs
      - name: Function logs
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log" "$RUNNER_TEMP/web.log"
      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e-smoke:
    name: E2E production smoke + parser bundles
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 2.117.0
      # The stack listens on 54320-54329, inside Linux's ephemeral range, so an
      # outgoing connection (such as an image pull) can hold one of them as its
      # source port and make Docker fail to bind it. Keep them out of that range.
      - name: Start local Supabase
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          supabase start
      - name: Seed local buckets
        run: supabase seed buckets
      # e2e/cli.test.ts renders through the app's /api routes into this function.
      - name: Serve the render function
        run: |
          nohup supabase functions serve render > "$RUNNER_TEMP/functions.log" 2>&1 &
          # A PUT gets 405 once the function answers, without using a quota.
          for _ in $(seq 1 90); do
            status="$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
              http://127.0.0.1:54321/functions/v1/render || true)"
            if [ "$status" = 405 ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/functions.log"
          exit 1
      - name: Export local Supabase env
        run: |
          set -a
          # shellcheck source=/dev/null
          source <(supabase status -o env)
          set +a
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf '%s=%s\n' \
              'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY' "$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:build
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Function logs
        if: failure()
        run: cat "$RUNNER_TEMP/functions.log"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-smoke-report
          path: playwright-report/
      - name: Stop Supabase
        if: always()
        run: supabase stop

  integration:
    name: RLS integration
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 2.117.0
      # The stack listens on 54320-54329, inside Linux's ephemeral range, so an
      # outgoing connection (such as an image pull) can hold one of them as its
      # source port and make Docker fail to bind it. Keep them out of that range.
      - name: Start local Supabase
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          supabase start
      - name: Apply migrations
        run: supabase db reset --local
      - name: Export local Supabase env
        run: |
          set -a
          # shellcheck source=/dev/null
          source <(supabase status -o env)
          set +a
          {
            printf 'E2E_SUPABASE_URL=%s\n' "$API_URL"
            printf 'E2E_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'E2E_SUPABASE_SERVICE_KEY=%s\n' "$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - run: npm run test:integration
      - name: Stop Supabase
        if: always()
        run: supabase stop

  e2e-auth:
    name: E2E auth
    runs-on: ubuntu-latest
    needs: [test]
    env:
      E2E_SUPABASE_URL: http://127.0.0.1:54321
      E2E_USER_EMAIL: e2e@supagist.test
      E2E_USER_PASSWORD: LocalE2EPass123!
      E2E_TEST_SECRET: local-e2e-test-secret
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 2.117.0
      # The stack listens on 54320-54329, inside Linux's ephemeral range, so an
      # outgoing connection (such as an image pull) can hold one of them as its
      # source port and make Docker fail to bind it. Keep them out of that range.
      - name: Start local Supabase
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          supabase start
      - name: Seed local buckets
        run: supabase seed buckets
      - name: Export local Supabase env
        run: |
          set -a
          # shellcheck source=/dev/null
          source <(supabase status -o env)
          set +a
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf '%s=%s\n' \
              'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY' "$PUBLISHABLE_KEY"
            printf 'E2E_SUPABASE_ANON_KEY=%s\n' "$ANON_KEY"
            printf 'E2E_SUPABASE_SERVICE_KEY=%s\n' "$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Apply migrations
        run: supabase db reset --local
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=setup
      - run: npm run test:e2e:auth
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-auth-report
          path: playwright-report/
      - name: Stop Supabase
        if: always()
        run: supabase stop
